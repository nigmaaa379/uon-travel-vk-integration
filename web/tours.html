<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Выбранный тур — Сбежим на море</title><meta name="description" content="Проверка выбранного тура и безопасная заявка на бронирование."><link rel="stylesheet" href="/assets/styles.css"><script src="/assets/completion.js" defer></script><style>main{padding:50px 0}.selected,form{max-width:760px;padding:24px;border-radius:16px;background:#eef8f9;margin:20px 0}label{display:block;margin:12px 0}input,select{width:100%;padding:12px}.consents label{display:flex;gap:10px}.consents input{width:auto}</style></head><body><header class="header"><div class="wrap head"><a class="brand" href="/"><b>Сбежим на море</b></a></div></header><main><div class="wrap"><h1>Проверим выбранный тур</h1><div class="selected" id="tour"></div><form data-compliant-form><h2>Контакты для бронирования</h2><input type="hidden" name="tourId" id="tourId"><input type="hidden" name="formType" value="booking"><label>Имя<input name="name" required minlength="2"></label><label>Телефон<input name="phone" required type="tel"></label><label>Email<input name="email" type="email"></label><label>Мессенджер<select name="messenger"><option>Telegram</option><option>MAX</option><option>WhatsApp</option><option>Телефон</option></select></label><div class="consents"><label><input type="checkbox" name="personalConsent" required><span>Согласен на <a href="/legal/consent.html">обработку персональных данных</a> и ознакомлен с <a href="/page/privacy">Политикой</a></span></label><label><input type="checkbox" name="countryInfoAcknowledged" required><span>Ознакомлен с <a href="/legal/travel-information.html">правилами въезда и пребывания</a></span></label><label><input type="checkbox" name="marketingConsent"><span>Согласен на <a href="/legal/marketing-consent.html">рассылку</a> (необязательно)</span></label></div><button class="btn primary" type="submit">Отправить на проверку</button><p class="form-status"></p></form></div></main><script>const p=new URLSearchParams(location.search),e=s=>String(s||'').replace(/[&<>]/g,''),id=p.get('tourId')||'';document.querySelector('#tourId').value=id;document.querySelector('#tour').innerHTML=`<h2>${e(p.get('hotel')||'Тур')}</h2><p>${e(p.get('destination'))} · ${e(p.get('dates'))}</p><p>${p.get('price')?'Стоимость на момент поиска: от '+e(p.get('price'))+' ₽':'Стоимость уточнит менеджер'}</p>`;</script></body></html>
