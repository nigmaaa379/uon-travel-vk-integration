limit_req_zone $binary_remote_addr zone=turs_leads:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=turs_admin:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=turs_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name tursbezhimnamore.ru www.tursbezhimnamore.ru;

    server_tokens off;
    client_max_body_size 256k;

    location = /health {
        deny all;
    }

    location = /api/site/leads {
        limit_req zone=turs_leads burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location ~ ^/(admin(?:/|$)|api/admin(?:/|$)) {
        limit_req zone=turs_admin burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        limit_conn turs_per_ip 30;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
